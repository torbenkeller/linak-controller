name: Stehauf

on:
  push:
    paths:
      - "Stehauf/**"
      - ".github/workflows/stehauf.yml"
  pull_request:
    paths:
      - "Stehauf/**"
      - ".github/workflows/stehauf.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Stehauf
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test
      - name: App-Bundle
        run: ./build-app.sh
      - name: Smoke-Test
        # Startet die App kurz und zeigt, was die Sensoren ins Protokoll schreiben.
        run: |
          build/Stehauf.app/Contents/MacOS/Stehauf &
          APP_PID=$!
          sleep 12
          kill -0 "$APP_PID"
          kill "$APP_PID"
          sleep 1
          cat "$HOME/Library/Application Support/Stehauf/logs/"*.jsonl
          cat "$HOME/Library/Application Support/Stehauf/config.json"
