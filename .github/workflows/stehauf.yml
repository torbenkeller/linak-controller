name: Stehauf

on:
  # Erlaubt, den Lauf im Actions-Tab von Hand zu starten.
  workflow_dispatch:
  push:
    paths:
      - "Stehauf/**"
      - ".github/workflows/stehauf.yml"
  pull_request:
    paths:
      - "Stehauf/**"
      - ".github/workflows/stehauf.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Stehauf
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test
      - name: App-Bundle
        run: ./build-app.sh
      - name: Erster Start mit Statusfenster
        run: |
          build/Stehauf.app/Contents/MacOS/Stehauf &
          APP_PID=$!
          sleep 12
          kill -0 "$APP_PID"
          kill "$APP_PID"
          sleep 1
          cat "$HOME/Library/Application Support/Stehauf/logs/"*.jsonl
      - name: Hintergrundbetrieb ohne Tisch
        # Der Fall "Mac unterwegs im Akkubetrieb": zeigt die verbrauchte CPU-Zeit.
        run: |
          build/Stehauf.app/Contents/MacOS/Stehauf &
          APP_PID=$!
          sleep 10
          echo "CPU-Zeit nach 10 s: $(ps -o time= -p "$APP_PID")"
          sleep 60
          echo "CPU-Zeit nach 70 s: $(ps -o time= -p "$APP_PID")"
          kill "$APP_PID"
      - name: Hintergrundbetrieb mit simuliertem Tisch
        run: |
          SUPPORT="$HOME/Library/Application Support/Stehauf"
          rm -rf "$SUPPORT"
          mkdir -p "$SUPPORT"
          cat > "$SUPPORT/config.json" <<'JSON'
          {"sitHeightConfirmed": true, "standHeightConfirmed": true, "useCalendar": false,
           "presenceTimeoutSeconds": 100000}
          JSON
          STEHAUF_FAKE_DESK=1 build/Stehauf.app/Contents/MacOS/Stehauf &
          APP_PID=$!
          sleep 10
          echo "CPU-Zeit nach 10 s: $(ps -o time= -p "$APP_PID")"
          sleep 60
          echo "CPU-Zeit nach 70 s: $(ps -o time= -p "$APP_PID")"
          kill "$APP_PID"
          sleep 1
          tail -n 3 "$SUPPORT/logs/"*.jsonl
      - name: Ganzer Ablauf mit simuliertem Tisch
        # Sitzen, Ankündigung, Hochfahren, Stehen, Runterfahren im Zeitraffer.
        run: |
          SUPPORT="$HOME/Library/Application Support/Stehauf"
          rm -rf "$SUPPORT"
          mkdir -p "$SUPPORT"
          cat > "$SUPPORT/config.json" <<'JSON'
          {"sitHeightConfirmed": true, "standHeightConfirmed": true, "useCalendar": false,
           "sitMinutes": 0.1, "standMinutes": 0.1, "countdownSeconds": 3, "soundEnabled": false,
           "presenceTimeoutSeconds": 100000, "activeIdleSeconds": 100000,
           "requireInputDuringCountdown": false, "meetingGraceSeconds": 0}
          JSON
          STEHAUF_FAKE_DESK=1 build/Stehauf.app/Contents/MacOS/Stehauf &
          APP_PID=$!
          sleep 60
          kill -0 "$APP_PID"
          kill "$APP_PID"
          sleep 1
          grep -h '"kind":"decision"' "$SUPPORT/logs/"*.jsonl | sed -E 's/.*"message":"([^"]*)".*"t":"([^"]*)".*/\2 \1/'
          grep -q 'Fahrt beendet' "$SUPPORT/logs/"*.jsonl
          grep -q 'Fahre down' "$SUPPORT/logs/"*.jsonl
